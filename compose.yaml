services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ros_xolo}
      POSTGRES_USER: ${POSTGRES_USER:-ros_xolo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ros_xolo_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    volumes: ["./:/app", "evidence:/app/docs/validation"]
  e2e:
    build: .
    command: pytest tests/e2e
    env_file:
      - path: .env
        required: false
    depends_on: {web: {condition: service_started}}
    volumes: ["./:/app", "evidence:/app/docs/validation"]
volumes:
  postgres_data:
  evidence:
